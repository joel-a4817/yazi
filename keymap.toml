[[mgr.prepend_keymap]]
on   = [ "<C-d>" ]
run  = "plugin drag"
desc = "Drag Files"

[[mgr.prepend_keymap]]
on   = ["o", "g"]
run  = "shell --orphan -- glide %h"
desc = "glide"

[[mgr.prepend_keymap]]
on   = ["o", "m"]
run  = "shell --orphan -- mpv %h"
desc = "mpv"

[[mgr.prepend_keymap]]
on   = ["o", "s"]
run  = "shell --orphan -- mpv --shuffle %h"
desc = "shuffle mpv"

[[mgr.prepend_keymap]]
on = ["o", "a"]
run = '''shell --orphan -- 'set -- %h; [ -f "$1" ] || exit; ext=$(printf "%%s" "${1##*.}" | tr "[:upper:]" "[:lower:]"); case "$ext" in
  docx|odt|rtf|txt|md|html|htm) app=wordcraft ;;
  xlsx|csv|tsv) app=gridcraft ;;
  pptx|deckcraft) app=deckcraft ;;
  pdf) app=pdfcraft ;;
  svg|svgz|ai|vectorcraft) app=vectorcraft ;;
  idml|designcraft) app=designcraft ;;
  ecproj) app=effectcraft ;;
  filmcraft|mp4|mov|mkv|webm|avi|m4v) app=filmcraft ;;
  dng|cr2|cr3|arw|nef|raf|rw2|rwl|pef|orf) app=lightcraft ;;
  pcraft|psd|psb|png|jpg|jpeg|tif|tiff|webp|gif|bmp|tga|ico|qoi|pnm|ppm|pgm|pbm|exr|hdr|avif) app=photocraft ;;
  *) exit 0 ;;
esac; exec "$app" "$1"'''
desc = "Open in matching ArtCraft app"

[[mgr.prepend_keymap]]
on   = ["o", "n"]
run  = "shell --block -- nvim %h"
desc = "nvim"

[[mgr.prepend_keymap]]
on   = ["o", "N"]
run  = "shell --orphan -- foot -T nvim -e nvim %h" #new window
desc = "nvim new"

#
### sudo
#
[[mgr.prepend_keymap]]
on   = ["R", "n"]
run  = "shell --block -- sudo -E nvim %h"
desc = "open Neovim"
[[mgr.prepend_keymap]]
on   = ["R", "N"]
run  = "shell --orphan -- foot -T nvim -e sudo -E nvim %h" #new window
desc = "open nvim new window"

[[mgr.prepend_keymap]]
on = ["R", "p", "p"]
run = "plugin sudo -- paste"
desc = "sudo paste"

[[mgr.prepend_keymap]]
on = ["R", "P"]
run = "plugin sudo -- paste --force"
desc = "sudo paste"

[[mgr.prepend_keymap]]
on = ["R", "r"]
run = "plugin sudo -- rename"
desc = "sudo rename"

[[mgr.prepend_keymap]]
on = ["R", "p", "l"]
run = "plugin sudo -- link"
desc = "sudo link"

[[mgr.prepend_keymap]]
on = ["R", "p", "r"]
run = "plugin sudo -- link --relative"
desc = "sudo link relative path"

[[mgr.prepend_keymap]]
on = ["R", "p", "L"]
run = "plugin sudo -- hardlink"
desc = "sudo hardlink"

[[mgr.prepend_keymap]]
on = ["R", "a"]
run = "plugin sudo -- create"
desc = "sudo create"

[[mgr.prepend_keymap]]
on = ["R", "d"]
run = "plugin sudo -- remove"
desc = "sudo trash"

[[mgr.prepend_keymap]]
on = ["R", "D"]
run = "plugin sudo -- remove --permanently"
desc = "sudo delete"

[[mgr.prepend_keymap]]
on = ["R", "m"]
run = "plugin sudo -- chmod"
desc = "sudo chmod"

#
### lazygit
#
[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "run lazygit"

#
### recycle-bin
#
[[mgr.prepend_keymap]]
on = ["T"]
run = "plugin recycle-bin"
desc = "Open Recycle Bin menu"

#
### restore
#
[[mgr.prepend_keymap]]
on = ["B", "u"]
run = "plugin restore"
desc = "Restore last deleted"

[[mgr.prepend_keymap]]
on = [ "B", "U" ]
run = "plugin restore -- --interactive"
desc = "Restore (Interactive)"

[[mgr.prepend_keymap]]
on = [ "B", "O" ]
run = "plugin restore -- --interactive --interactive-overwrite"
desc = "Restore (Interactive overwrite)"
